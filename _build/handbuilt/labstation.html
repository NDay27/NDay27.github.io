<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Station drawing lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&display=swap">
<style>html,body{margin:0;height:100%;background:#000}.scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","@pmndrs/assets/":"https://cdn.jsdelivr.net/npm/@pmndrs/assets@1.7.0/"}}</script>
</head><body><div class="scene"><canvas id="c"></canvas></div>
<script type="module">
// Hidden-line drawing of the Brecklin's station, dumped from the same model the $1,250 page runs live.
// Usage: labstation.html?cam=x,y,z&tgt=x,y,z&fov=28   (window.__svg = {W,H,layers,signs}, window.__done when ready)
// Add &color=1 for the same view in color at 2x: window.__png = {night, day, mask} (data URLs; mask = alpha of the station alone).
const q = new URLSearchParams(location.search), num = (k, d) => q.has(k) ? +q.get(k) : d, vec = (k, d) => q.has(k) ? q.get(k).split(",").map(Number) : d;
const src = await (await fetch("../../brecklins1250/scene.js")).text();
const url = URL.createObjectURL(new Blob([src + "\n;window.__S={THREE,scene,cam,R,canopy,bld,car,att,controls,state:()=>carState,moving:()=>carMoving,BX,BZ,BH,CH,setMode,modeT:()=>modeT};"], {type: "text/javascript"}));
await import(url);
const S = window.__S, THREE = S.THREE;
// wait for the car to reach the pump and the attendant to finish, so the sheet shows a car being served
await new Promise(r => { const t0 = performance.now(), iv = setInterval(() => { if ((S.state() === "pump" && !S.moving()) || performance.now() - t0 > 90000) { clearInterval(iv); r(); } }, 500); });
if (q.has("color")) await new Promise(r => { const t0 = performance.now(), iv = setInterval(() => { if (!S.att.visible || performance.now() - t0 > 120000) { clearInterval(iv); r(); } }, 500); });
S.controls.enabled = false;
const cam = S.cam.clone(); cam.fov = num("fov", 28); cam.aspect = innerWidth / innerHeight; cam.position.fromArray(vec("cam", [16, 5, 32])); cam.lookAt(new THREE.Vector3(...vec("tgt", [-3, 2.2, -4]))); cam.updateProjectionMatrix(); cam.updateMatrixWorld(true);
window.__svg = drawing();
if (q.has("color")) {
  const R = S.R, W = innerWidth * 2, H = innerHeight * 2, grab = () => { R.setRenderTarget(null); R.render(S.scene, cam); return R.domElement.toDataURL("image/png"); };
  R.setPixelRatio(1); R.setSize(W, H, false);
  const out = {night: grab()};
  S.setMode("day"); await new Promise(r => { const t0 = performance.now(), iv = setInterval(() => { if (S.modeT() >= 1 || performance.now() - t0 > 180000) { clearInterval(iv); r(); } }, 500); });
  await new Promise(r => setTimeout(r, 1500)); out.day = grab();
  // alpha mask: everything the sheet draws (station, pumps, car, apron), from a depth pass at the same size
  const dm = new THREE.MeshBasicMaterial({color: 0xffffff, side: THREE.DoubleSide}), ds = new THREE.Scene();
  window.__occ.forEach(m => { const c = new THREE.Mesh(m.geometry, dm); c.matrixAutoUpdate = false; c.matrix.copy(m.matrixWorld); c.matrixWorld.copy(m.matrixWorld); ds.add(c); });
  const rt = new THREE.WebGLRenderTarget(W, H); R.setRenderTarget(rt); R.setClearColor(0x000000, 1); R.clear(); R.render(ds, cam); const buf = new Uint8Array(W * H * 4); R.readRenderTargetPixels(rt, 0, 0, W, H, buf); R.setRenderTarget(null);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const cx = cv.getContext("2d"), im = cx.createImageData(W, H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const v = buf[((H - 1 - y) * W + x) * 4] > 127 ? 255 : 0, i = (y * W + x) * 4; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  cx.putImageData(im, 0, 0); out.mask = cv.toDataURL("image/png"); window.__png = out;
}
window.__done = true;

function drawing() {
  const R = S.R, W = innerWidth, H = innerHeight, keep = [], occ = [];
  S.scene.updateMatrixWorld(true);
  const shown = o => { for (let x = o; x; x = x.parent) if (!x.visible) return false; return true; };
  const under = (o, g) => { for (let x = o; x; x = x.parent) if (x === g) return true; return false; };
  S.scene.traverse(o => {
    if (!o.isMesh || o.isInstancedMesh || !shown(o) || under(o, S.att)) return;
    const t = o.geometry.type, p = o.geometry.parameters || {};
    if (t === "SphereGeometry" || t === "IcosahedronGeometry" || t === "PlaneGeometry" || t === "CircleGeometry") return;          // sky, tree crowns, ground, decals
    if (t === "BufferGeometry" && !under(o, S.car)) return;
    if (o.material && o.material.transparent && o.material.opacity < .5) return;
    const bb = new THREE.Box3().setFromObject(o);
    let top = o; while (top.parent && top.parent !== S.scene) top = top.parent;
    const L = under(o, S.canopy) ? "canopy" : under(o, S.bld) ? "wall" : under(o, S.car) ? "car" : (top.isGroup && Math.abs(top.position.z) < .01 && Math.abs(top.position.x) < 6) ? "pump" : "site";
    if (L === "site" && (bb.max.y > .6 || bb.max.x - bb.min.x > 100)) return;   // trees, the neighbour, the endless street: not on the sheet
    occ.push(o); o.userData.layer = L; keep.push(o);
  });
  window.__occ = occ;
  const far = 400;
  const dm = new THREE.ShaderMaterial({side: THREE.DoubleSide, vertexShader: `varying float vz;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vz=-mv.z;gl_Position=projectionMatrix*mv;}`,
    fragmentShader: `#include <packing>\nvarying float vz;void main(){gl_FragColor=packDepthToRGBA(clamp(vz/${far.toFixed(1)},0.,.9999));}`});
  const ds = new THREE.Scene(); occ.forEach(m => { const c = new THREE.Mesh(m.geometry, dm); c.matrixAutoUpdate = false; c.matrix.copy(m.matrixWorld); c.matrixWorld.copy(m.matrixWorld); ds.add(c); });
  const rt = new THREE.WebGLRenderTarget(W, H); R.setRenderTarget(rt); R.setClearColor(0xffffff, 1); R.clear(); R.render(ds, cam); R.setRenderTarget(null);
  const buf = new Uint8Array(W * H * 4); R.readRenderTargetPixels(rt, 0, 0, W, H, buf);
  const depthAt = (x, y) => { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= W || y >= H) return far; const i = ((H - 1 - y) * W + x) * 4;
    return (buf[i] / 255 / (256 * 256 * 256) + buf[i + 1] / 255 / (256 * 256) + buf[i + 2] / 255 / 256 + buf[i + 3] / 255) * far; };
  const out = {}, v = new THREE.Vector3(), vi = cam.matrixWorldInverse;
  const proj = p => { v.copy(p).project(cam); const z = -p.clone().applyMatrix4(vi).z; return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H, z]; };
  function seg(A, B, layer) {
    const a = proj(A), b = proj(B); if (a[2] < .2 || b[2] < .2) return; const n = Math.max(2, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 1.5)); let run = null; (out[layer] ||= []);
    for (let i = 0; i <= n; i++) { const t = i / n, P = A.clone().lerp(B, t), s = proj(P); let d = 0; for (const [dx, dy] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) d = Math.max(d, depthAt(s[0] + dx, s[1] + dy));
      const vis = s[2] <= d + .05 + s[2] * .002;
      if (vis) { if (!run) run = [s[0], s[1]]; run[2] = s[0]; run[3] = s[1]; } else if (run) { if (run[2] !== undefined) out[layer].push(run); run = null; } }
    if (run && run[2] !== undefined) out[layer].push(run);
  }
  // rounded boxes (pumps, the car) have no hard edges: draw their bounding box instead
  const hard = g => { if (g.type !== "BoxGeometry" || g.attributes.position.count <= 24) return g; g.computeBoundingBox(); const s = g.boundingBox.getSize(new THREE.Vector3()), c = g.boundingBox.getCenter(new THREE.Vector3()), b = new THREE.BoxGeometry(s.x, s.y, s.z); b.translate(c.x, c.y, c.z); return b; };
  for (const m of keep) { const eg = new THREE.EdgesGeometry(hard(m.geometry), 30), p = eg.attributes.position, L = m.userData.layer;
    for (let i = 0; i < p.count; i += 2) seg(new THREE.Vector3().fromBufferAttribute(p, i).applyMatrix4(m.matrixWorld), new THREE.Vector3().fromBufferAttribute(p, i + 1).applyMatrix4(m.matrixWorld), L); }
  // sign faces (top-left, top-right, bottom-left) so the sheet can letter them
  const quad = (cx, cy, z, w, h) => [[cx - w / 2, cy + h / 2], [cx + w / 2, cy + h / 2], [cx - w / 2, cy - h / 2]].map(([x, y]) => proj(new THREE.Vector3(x, y, z)).slice(0, 2));
  const signs = {fascia: quad(0, S.CH + .5, 4.93, 15.1, 1), store: quad(S.BX - 5, 3.65, S.BZ + .14, 6.4, 1), bays: quad(S.BX + 6, S.BH - .38, S.BZ + .1, 5.4, .7)};
  rt.dispose(); return {W, H, layers: out, signs};
}
</script></body></html>
