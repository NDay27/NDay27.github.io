<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Vehicle drawing lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,800&display=swap">
<style>html,body{margin:0;height:100%;background:#000}.scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","@pmndrs/assets/":"https://cdn.jsdelivr.net/npm/@pmndrs/assets@1.7.0/"}}</script>
</head><body><div class="scene"><canvas id="c"></canvas></div>
<script type="module">
// Vehicle-only hidden-line drawing (used for the Just Dents dent map). Same params as labauto.html?tod=.55&cam=x,y,z&tgt=x,y,z&fov=30&door=1&door2=0&lift=0&hood=0&wheels=1&pos=0&color=red&sign=Auto+Repair[&fix=0..1&kind=body]
import {makeWorld} from "../../harlow/assets/world.js";
import {makeGarage, PAINT} from "../../f/assets/garage.js";
const q = new URLSearchParams(location.search), num = (k, d) => q.has(k) ? +q.get(k) : d, vec = (k, d) => q.has(k) ? q.get(k).split(",").map(Number) : d;
await document.fonts.load("800 40px Archivo");
let G = null;
const world = await makeWorld({cam: {pos: vec("cam", [-12, 4, 24]), target: vec("tgt", [1, 2.4, 0]), minD: 1, maxD: 200, minAz: -9, maxAz: 9, maxPolar: Math.PI * .6}, offset: false, fov: () => num("fov", 32), tod: num("tod", .5), ground: "lawn", grassR: 46, grassH: .15, grassW: .04, grassN: 1.6,
  exclude: (x, z) => (x > -7.2 && x < 11 && z > -11.5 && z < 6) || (z > -.6 && z < 30.6 && x > -30.4 && x < 34.4)});
G = await makeGarage(world, {kind: q.get("kind") || "auto", sign: q.get("sign") || (q.get("kind") === "body" ? "Auto Body" : "Auto Repair"), color: PAINT[q.get("color")] ?? PAINT.red, second: q.get("second") !== "0"});
window.G = G; window.world = world;
G.set({door: num("door", 1), door2: num("door2", 0), lift: num("lift", 0), hood: num("hood", 0), wheels: num("wheels", 1), pos: num("pos", 0), fix: q.has("fix") ? num("fix", 1) : undefined, lights: q.has("lights") ? !!num("lights", 0) : undefined});
world.ctl.autoRotate = false; world.ctl.enableDamping = false; world.setQuality(2);
world.size(); world.setTodNow(num("tod", .5));
await world.ready; world.setTodNow(num("tod", .5)); world.shadows();
// stills that sit behind a headline are framed like the live scene: subject pushed right of the copy
if (q.has("ox")) { const w = world.host.clientWidth, h = world.host.clientHeight; world.cam.setViewOffset(w, h, -num("ox", 0) * w, 0, w, h); world.cam.updateProjectionMatrix(); }
if (q.get("mode") === "svg") { world.ctl.update(); world.cam.updateMatrixWorld(); window.__svg = drawing(); window.__done = true; }
else { for (let i = 0; i < 4; i++) { world.grade.uniforms.t.value = i; world.renderOnce(); await new Promise(r => requestAnimationFrame(r)); } window.__done = true; }

// Hidden-line drawing from the same camera: edges of every mesh tagged with userData.layer, kept where a depth pass says they are visible.
function drawing() {
  const THREE = world.THREE, cam = world.cam, R = world.R, W = R.domElement.width, H = R.domElement.height, keep = [], occ = [];
  G.root.updateMatrixWorld(true);
  const shown = o => { for (let x = o; x; x = x.parent) if (!x.visible) return false; return true; };
  G.truck.car.traverse(o => { if (o.isMesh && !o.isInstancedMesh && shown(o)) { if (o.geometry.type === "PlaneGeometry" || new THREE.Box3().setFromObject(o).max.y < .05) return; occ.push(o); if (!o.userData.layer) o.userData.layer = "detail"; keep.push(o); } });
  const far = 400;
  const dm = new THREE.ShaderMaterial({side: THREE.DoubleSide, vertexShader: `varying float vz;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vz=-mv.z;gl_Position=projectionMatrix*mv;}`,
    fragmentShader: `#include <packing>\nvarying float vz;void main(){gl_FragColor=packDepthToRGBA(clamp(vz/${far.toFixed(1)},0.,.9999));}`});
  const ds = new THREE.Scene(); occ.forEach(m => { const c = new THREE.Mesh(m.geometry, dm); c.matrixAutoUpdate = false; c.matrix.copy(m.matrixWorld); c.matrixWorld.copy(m.matrixWorld); ds.add(c); });
  const rt = new THREE.WebGLRenderTarget(W, H); cam.updateMatrixWorld(); R.setRenderTarget(rt); R.setClearColor(0xffffff, 1); R.clear(); R.render(ds, cam); R.setRenderTarget(null);
  const buf = new Uint8Array(W * H * 4); R.readRenderTargetPixels(rt, 0, 0, W, H, buf);
  const depthAt = (x, y) => { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= W || y >= H) return far; const i = ((H - 1 - y) * W + x) * 4;
    return (buf[i] / 255 / (256 * 256 * 256) + buf[i + 1] / 255 / (256 * 256) + buf[i + 2] / 255 / 256 + buf[i + 3] / 255) * far; };
  const out = {}, v = new THREE.Vector3(), vi = cam.matrixWorldInverse;
  const proj = p => { v.copy(p).project(cam); const z = -p.clone().applyMatrix4(vi).z; return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H, z]; };
  function seg(A, B, layer) {
    const a = proj(A), b = proj(B); if (a[2] < .2 || b[2] < .2) return; const n = Math.max(2, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 1.5)); let run = null; (out[layer] ||= []);
    for (let i = 0; i <= n; i++) { const t = i / n, P = A.clone().lerp(B, t), s = proj(P); let d = 0; for (const [dx, dy] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) d = Math.max(d, depthAt(s[0] + dx, s[1] + dy));
      const vis = s[2] <= d + .05 + s[2] * .002;
      if (vis) { if (!run) run = [s[0], s[1]]; run[2] = s[0]; run[3] = s[1]; } else if (run) { if (run[2] !== undefined) out[layer].push(run); run = null; } }
    if (run && run[2] !== undefined) out[layer].push(run);
  }
  for (const m of keep) { if (m.userData.layer === "ground" && m.geometry.type === "PlaneGeometry") continue; const eg = new THREE.EdgesGeometry(m.geometry, 24), p = eg.attributes.position, L = m.userData.layer;
    for (let i = 0; i < p.count; i += 2) seg(new THREE.Vector3().fromBufferAttribute(p, i).applyMatrix4(m.matrixWorld), new THREE.Vector3().fromBufferAttribute(p, i + 1).applyMatrix4(m.matrixWorld), L); }
  // car-local reference points (pts=x,y,z;x,y,z) projected to the sheet, for notes and the reflection lines
  const sign = (q.get("pts") || "").split(";").filter(Boolean).map(s => proj(new THREE.Vector3(...s.split(",").map(Number)).applyMatrix4(G.truck.car.matrixWorld)).slice(0, 2));
  rt.dispose(); return {W, H, layers: out, sign};
}
</script></body></html>
