<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Harlow render lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Schibsted+Grotesk:wght@600;700&display=swap">
<style>html,body{margin:0;height:100%;background:#000}.scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","@pmndrs/assets/":"https://cdn.jsdelivr.net/npm/@pmndrs/assets@1.7.0/"}}</script>
</head><body><div class="scene"><canvas id="c"></canvas></div>
<script type="module">
// Usage: lab.html?p=1&[drive=wash|concrete&fix=0..1&truck=Name&tc=hex&ink=hex]&tod=.55&cam=x,y,z&tgt=x,y,z&fov=30&siding=white&roof=black&trim=black&door=fir&porch=1
import {makeWorld} from "../../harlow/assets/world.js";
import {makeHouse} from "../../harlow/assets/house.js";
import {lawn, yardTree, flatwork, workTruck, acUnit, yardLine, fixList, stumpGrind, towJob} from "../../f/assets/yard.js";
const q = new URLSearchParams(location.search), num = (k, d) => q.has(k) ? +q.get(k) : d, vec = (k, d) => q.has(k) ? q.get(k).split(",").map(Number) : d;
await document.fonts.load("700 40px Newsreader"); await document.fonts.load("700 40px 'Schibsted Grotesk'");
let house, tree0 = null;
const world = await makeWorld({cam: {pos: vec("cam", [-14, 7, 26]), target: vec("tgt", [2, 3.6, 0]), minD: 1, maxD: 200, minAz: -9, maxAz: 9, maxPolar: Math.PI * .6}, offset: false, fov: () => num("fov", 30), tod: num("tod", .5), ground: "lawn", grassR: 34, grassH: .15, grassW: .04, grassN: 2.6,
  exclude: (x, z) => (house ? house.exclude(x, z) : false) || (tree0 ? tree0.exclude(x, z) : false)});
house = makeHouse(world);
const line = q.has("pipe") ? yardLine(world) : q.has("stump") ? stumpGrind(world) : null;
// grass was planted before the house existed; replant around the footprint
if (world.grass) { const g = world.grass, m = new world.THREE.Matrix4(), c = new world.THREE.Color(); let n = 0; const P = g.userData.pos;
  for (let i = 0; i < P.length; i++) { const [x, z, sc, qq] = P[i]; if (house.exclude(x, z) || (line && line.exclude(x, z))) continue; m.compose(new world.THREE.Vector3(x, 0, z), qq, new world.THREE.Vector3(1, sc, 1)); g.setMatrixAt(n, m); g.getColorAt(i, c); g.setColorAt(n, c); n++; }
  g.count = n; g.instanceMatrix.needsUpdate = true; }
if (q.has("tree")) { tree0 = yardTree(world); tree0.shape(num("tree", 0)); tree0.down(num("down", 0)); }
const yard = lawn(world, {exclude: (x, z) => house.exclude(x, z) || (tree0 ? tree0.exclude(x, z) : false)}); yard.set({h: num("gh", 1), stripes: num("stripes", 0), cut: num("cut", 1)});
const hx = v => v && /^[0-9a-f]{6}$/i.test(v) ? parseInt(v, 16) : v;
house.setFinish({siding: hx(q.get("siding")) || "white", roof: hx(q.get("roof")) || "black", trim: hx(q.get("trim")) || "black", door: q.get("door") || "fir", porch: q.get("porch") !== "0"});
house.setProgress(num("p", 1));
if (q.has("drive")) flatwork(world, {kind: q.get("drive")}).set({fix: num("fix", 0)});
if (q.has("ac")) acUnit(world).set({fix: num("ac", 0)});
if (line) line.set({fix: num("pipe", num("stump", 0))});
if (q.has("hm")) fixList(world).set({fix: num("hm", 0)});
if (q.has("tow")) (await towJob(world, {sign: q.get("truck") || "", font: "Schibsted Grotesk"})).set({fix: num("tow", 0)});
else if (q.has("truck")) await workTruck(world, {sign: q.get("truck"), x: num("tx", 9.5), z: num("tz", 21.5), ry: num("tr", 0), font: "Schibsted Grotesk", color: q.has("tc") ? parseInt(q.get("tc"), 16) : undefined, ink: q.get("ink") ? "#" + q.get("ink") : undefined});
world.ctl.autoRotate = false; world.ctl.enableDamping = false; world.setQuality(2);
world.size(); world.setTodNow(num("tod", .5));
await world.ready; world.setTodNow(num("tod", .5)); house.setProgress(num("p", 1) - .0001); house.setProgress(num("p", 1));
if (q.get("mode") === "svg") { world.ctl.update(); world.cam.updateMatrixWorld(); window.__svg = drawing(); window.__done = true; }
else { for (let i = 0; i < 4; i++) { world.grade.uniforms.t.value = i; world.renderOnce(); await new Promise(r => requestAnimationFrame(r)); } window.__done = true; }

// Hidden-line drawing of the house from the same camera: edges of every finished surface, siding battens and roof seams,
// kept only where a depth pass says they are visible. Output in pixels, grouped by layer.
function drawing() {
  const THREE = world.THREE, M = house.M, cam = world.cam, R = world.R;
  const layerOf = new Map([[M.siding, "wall"], [M.roof, "roof"], [M.wingRoof, "roof"], [M.porchRoof, "roof"], [M.frame, "open"], [M.door, "open"], [M.gdoorFace, "open"], [M.metal, "open"], [M.trim, "trim"], [M.timber, "porch"], [M.deck, "porch"], [M.slab, "ground"], [M.conc, "ground"]]);
  const W = R.domElement.width, H = R.domElement.height;
  const keep = []; house.root.updateMatrixWorld(true);
  const shown = o => { for (let x = o; x; x = x.parent) if (!x.visible) return false; return true; };
  house.root.traverse(o => { if (o.isMesh && !o.isInstancedMesh && layerOf.has(o.material) && shown(o) && new THREE.Vector3().setFromMatrixPosition(o.matrixWorld).z < +(q.get("zmax") || 14)) keep.push(o); });
  // depth pass (linear view depth packed in RGBA)
  const far = 400;
  const dm = new THREE.ShaderMaterial({side: THREE.DoubleSide, vertexShader: `varying float vz;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vz=-mv.z;gl_Position=projectionMatrix*mv;}`,
    fragmentShader: `#include <packing>\nvarying float vz;void main(){gl_FragColor=packDepthToRGBA(clamp(vz/${far.toFixed(1)},0.,.9999));}`});
  const ds = new THREE.Scene(); const clones = keep.map(m => { const c = new THREE.Mesh(m.geometry, dm); c.matrixAutoUpdate = false; c.matrix.copy(m.matrixWorld); c.matrixWorld.copy(m.matrixWorld); ds.add(c); return c; });
  const rt = new THREE.WebGLRenderTarget(W, H); cam.updateMatrixWorld(); R.setRenderTarget(rt); R.setClearColor(0xffffff, 1); R.clear(); R.render(ds, cam); R.setRenderTarget(null);
  const buf = new Uint8Array(W * H * 4); R.readRenderTargetPixels(rt, 0, 0, W, H, buf);
  const depthAt = (x, y) => { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= W || y >= H) return far; const i = ((H - 1 - y) * W + x) * 4;
    return (buf[i] / 255 / (256 * 256 * 256) + buf[i + 1] / 255 / (256 * 256) + buf[i + 2] / 255 / 256 + buf[i + 3] / 255) * far; };
  const out = {}, v = new THREE.Vector3(), vi = cam.matrixWorldInverse;
  const proj = p => { v.copy(p).project(cam); const z = -p.clone().applyMatrix4(vi).z; return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H, z]; };
  function seg(A, B, layer) {
    const a = proj(A), b = proj(B); if (a[2] < .2 || b[2] < .2) return; const n = Math.max(2, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 1.5)); let run = null; (out[layer] ||= []);
    for (let i = 0; i <= n; i++) { const t = i / n, P = A.clone().lerp(B, t), s = proj(P); let d = far; for (const [dx, dy] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) d = Math.max(d === far ? -1 : d, depthAt(s[0] + dx, s[1] + dy)) , d = Math.max(d, 0);
      const vis = s[2] <= d + .05 + s[2] * .002;
      if (vis) { if (!run) run = [s[0], s[1]]; run[2] = s[0]; run[3] = s[1]; } else if (run) { if (run[2] !== undefined) out[layer].push(run); run = null; } }
    if (run && run[2] !== undefined) out[layer].push(run);
  }
  for (const m of keep) { const eg = new THREE.EdgesGeometry(m.geometry, 22), p = eg.attributes.position, L = layerOf.get(m.material);
    for (let i = 0; i < p.count; i += 2) seg(new THREE.Vector3().fromBufferAttribute(p, i).applyMatrix4(m.matrixWorld), new THREE.Vector3().fromBufferAttribute(p, i + 1).applyMatrix4(m.matrixWorld), L); }
  // battens on every sided wall
  for (const w of house.walls) { for (let u = .05; u < w.len; u += 1 / 3) { const top = w.y1 + (w.g > 0 ? w.g * (1 - Math.abs(u - w.len / 2) / (w.len / 2)) : 0); let ys = [[w.y0, top]];
      for (const o of w.open) if (Math.abs(u - o.u) < o.w / 2 + .12) ys = ys.flatMap(([a, b]) => { const r = []; if (o.y0 - .14 > a) r.push([a, Math.min(b, o.y0 - .14)]); if (o.y1 + .12 < b) r.push([Math.max(a, o.y1 + .12), b]); return r; });
      for (const [a, b] of ys) if (b - a > .05) seg(w.at(u, a, .045), w.at(u, b, .045), "batten"); } }
  // standing seams on the metal roofs
  house.root.traverse(o => { if (!o.isMesh || !o.userData.seams || !shown(o)) return; const g = o.geometry.parameters; const sx = g.width, sz = g.depth, hy = g.height / 2 + .001;
    if (o.userData.seams === "x") for (let x = -sx / 2 + .24; x < sx / 2; x += .48) seg(new THREE.Vector3(x, hy, -sz / 2).applyMatrix4(o.matrixWorld), new THREE.Vector3(x, hy, sz / 2).applyMatrix4(o.matrixWorld), "seam");
    else for (let z = -sz / 2 + .24; z < sz / 2; z += .48) seg(new THREE.Vector3(-sx / 2, hy, z).applyMatrix4(o.matrixWorld), new THREE.Vector3(sx / 2, hy, z).applyMatrix4(o.matrixWorld), "seam"); });
  // window panes as filled shapes (for a marker wash in the drawing)
  out.glass = []; for (const g of house.glows) { if (!shown(g)) continue; const pa = g.geometry.parameters, hw = pa.width / 2, hh = pa.height / 2; g.updateMatrixWorld();
    const c = proj(new THREE.Vector3(0, 0, .14).applyMatrix4(g.matrixWorld)); const d = depthAt(c[0], c[1]); if (c[2] > d + .3) continue;
    out.glass.push([[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].flatMap(([x, y]) => proj(new THREE.Vector3(x, y, .14).applyMatrix4(g.matrixWorld)).slice(0, 2))); }
  clones.forEach(c => ds.remove(c)); rt.dispose();
  return {W, H, layers: out};
}
</script></body></html>
